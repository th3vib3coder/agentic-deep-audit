[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-deep-audit"
version = "0.1.0"
description = "Evidence-first audit engine with CLI, Codex, MCP and package adapters for local and GitHub open-source repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary until an explicit release license is selected" }
authors = [
  { name = "AgenticDeepAudit contributors" }
]
dependencies = [
  "defusedxml>=0.7.1",
  "jsonschema>=4.0",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
deep-audit = "agentic_deep_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_deep_audit = ["schemas/*.json", "policies/*.json", "templates/*", "docs/adapters/*.md", "docs/adapters/*/*.json"]

[tool.pytest.ini_options]
norecursedirs = ["tests/fixtures"]
