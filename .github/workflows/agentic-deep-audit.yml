name: Agentic Deep Audit

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Compile source
        env:
          PYTHONPATH: src
        run: python -m compileall -q -x "tests[\\/]fixtures" src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest tests -q

      - name: Smoke audits
        env:
          PYTHONPATH: src
        run: python tests/run_smoke_tests.py --report audit/SMOKE_TEST_REPORT.md
